<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My PeOr — your day, goals, and progress in one calm organizer.">
  <meta name="theme-color" content="#f5f7fb">
  <title>My PeOr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="My PeOr dashboard">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.75h10a2 2 0 0 1 2 2v12.5H5V6.75a2 2 0 0 1 2-2Z"/><path d="m8.5 11 2 2 5-5M8 17h8M9 2.75v4M15 2.75v4"/></svg></span>
        <span>My PeOr</span>
      </a>
      <button class="collapse-toggle icon-button" data-action="collapse-sidebar" aria-label="Collapse sidebar" title="Collapse sidebar">‹</button>
      <div class="sidebar-label">Workspace</div>
      <nav class="side-nav" id="main-nav" aria-label="Main navigation">
        <button data-page="dashboard" class="nav-item active"><span class="nav-icon">⌂</span>Dashboard</button>
        <button data-page="tasks" class="nav-item"><span class="nav-icon">☷</span>My Tasks</button>
        <button data-page="schedule" class="nav-item"><span class="nav-icon">◷</span>My Schedule</button>
        <button data-page="academics" class="nav-item"><span class="nav-icon">▤</span>Academics</button>
        <button data-page="lessons" class="nav-item"><span class="nav-icon">▧</span>Lesson Organizer</button>
        <button data-page="deadlines" class="nav-item"><span class="nav-icon">⌛</span>Deadlines</button>
        <button data-page="notifications" class="nav-item"><span class="nav-icon">♧</span>Notifications<span class="nav-count" id="sidebar-notification-count" hidden></span></button>
        <button data-page="progress" class="nav-item"><span class="nav-icon">↗</span>Progress</button>
        <button data-page="about" class="nav-item"><span class="nav-icon">ⓘ</span>About My PeOr</button>
      </nav>
      <div class="sidebar-bottom">
        <button data-page="settings" class="nav-item"><span class="nav-icon">⚙</span>Settings</button>
        <div class="account-mini"><span class="avatar" id="sidebar-avatar">M</span><span><strong id="sidebar-name">My Organizer</strong><small>Saved in this browser</small></span><button class="icon-button" data-action="settings" aria-label="Open settings">···</button></div>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="mobile-menu icon-button" data-action="menu" aria-label="Open menu">☰</button>
        <div class="breadcrumb"><span>My PeOr</span><span class="crumb-divider">/</span><strong id="current-section">Dashboard</strong></div>
        <div class="global-search-wrap">
          <span aria-hidden="true">⌕</span>
          <input type="search" id="global-search" placeholder="Search everything…" aria-label="Search tasks, events, and subjects" autocomplete="off">
          <button class="search-clear icon-button" data-action="clear-global-search" aria-label="Clear search" hidden>×</button>
        </div>
        <div class="top-actions">
          <span class="storage-status is-saving" id="storage-status" role="status" aria-live="polite" title="Loading browser storage"><i></i><span>Loading…</span></span>
          <button class="icon-button notification-button" data-action="open-notifications" aria-label="Open notifications" title="Notifications">♧<span class="notification-dot" id="notification-dot" hidden></span></button>
          <button class="icon-button theme-toggle" data-action="theme" aria-label="Toggle color theme" title="Toggle theme">☾</button>
          <button class="button primary add-task-global" data-action="add-task"><span>＋</span> Add Task</button>
        </div>
      </header>

      <main id="main-content" tabindex="-1"><div class="empty-state">Loading your saved data…</div></main>
      <footer class="app-footer"><span>Your day. Your goals. Your progress.</span><span>Data stays in this browser on this device.</span><span>My PeOr © 2026 · Created by Samuel Bumatay</span></footer>
    </div>
  </div>

  <nav class="mobile-bottom-nav" aria-label="Quick navigation">
    <button data-page="dashboard" class="active"><span>⌂</span>Today</button>
    <button data-page="tasks"><span>☷</span>Tasks</button>
    <button data-page="schedule"><span>◷</span>Schedule</button>
    <button data-page="deadlines"><span>⌛</span>Deadlines</button>
  </nav>

  <input id="import-backup-file" type="file" accept="application/json,.json" hidden>
  <input id="lesson-file-input" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.txt,.jpg,.jpeg,.png,.gif,.webp,.bmp,application/pdf,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/jpeg,image/png,image/gif,image/webp,image/bmp" multiple hidden>
  <div class="modal-backdrop" id="modal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-heading"><div><p class="eyebrow" id="modal-eyebrow">Organizer</p><h2 id="modal-title">Add item</h2></div><button class="icon-button" data-action="close-modal" aria-label="Close dialog">×</button></div>
      <div id="modal-body"></div>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div class="lesson-upload-status" id="lesson-upload-status" role="status" aria-live="polite" hidden>
    <span class="lesson-upload-icon" aria-hidden="true"></span>
    <span class="lesson-upload-label"></span>
    <progress max="100" value="0" aria-label="File reading progress"></progress>
  </div>
</body>
</html>
